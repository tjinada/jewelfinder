# =============================================================================
# Jewel Finder - Docker Compose
# =============================================================================
# Standalone stack: the app (frontend + API in one container) plus MongoDB.
#
# Usage:
#   1. cp .env.example .env   and fill in your values
#   2. docker compose up -d --build
#   3. docker compose logs -f jewel-finder
#   App: http://localhost:8090
# =============================================================================

services:
  mongo:
    image: mongo:7
    container_name: jewel-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - jewel
    restart: unless-stopped

  jewel-finder:
    container_name: jewel-finder
    user: "99:100"   # Unraid nobody:users — uploaded files match your other shares
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:3000"
    env_file:
      - .env
    environment:
      # Override for the Docker network (container name, not localhost)
      - MONGO_URI=mongodb://mongo:27017/jewel-finder
      - MEDIA_DIR=/app/media
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Uploaded jewelry images -> Unraid share (bind mount)
      - /mnt/user/data/media/jewelry:/app/media
    depends_on:
      - mongo
    networks:
      - jewel
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  jewel:
    driver: bridge

volumes:
  mongo-data:
