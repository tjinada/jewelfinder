<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>The Clasp · Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --bg: #14110f;
        --card: #1f1b18;
        --card-2: #262019;
        --line: #342c24;
        --text: #f5efe6;
        --muted: #a89e90;
        --accent: #c9a96a;
        --accent-2: #8fae9b;
        --accent-3: #b5879c;
        --accent-4: #7f93b5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Montserrat', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        padding: 28px clamp(16px, 4vw, 48px) 8px;
      }
      .brand { display: flex; align-items: baseline; gap: 12px; }
      .brand h1 {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: clamp(24px, 3vw, 34px);
        margin: 0;
        letter-spacing: 0.3px;
      }
      .brand span { color: var(--accent); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
      .meta { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 13px; }
      button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--bg);
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        padding: 9px 18px;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      button:hover { opacity: 0.88; }
      button:disabled { opacity: 0.5; cursor: default; }
      main { padding: 8px clamp(16px, 4vw, 48px) 56px; }
      .grid { display: grid; gap: 16px; }
      .kpis { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 24px; }
      .kpi {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
      }
      .kpi .label { color: var(--muted); font-size: 12px; letter-spacing: 0.4px; }
      .kpi .value { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; margin-top: 6px; }
      .kpi .sub { color: var(--accent); font-size: 12px; margin-top: 4px; min-height: 16px; }
      .charts { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px 20px;
      }
      .panel.wide { grid-column: 1 / -1; }
      .panel h2 {
        font-family: 'Montserrat', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 14px;
      }
      .canvas-wrap { position: relative; height: 260px; }
      .canvas-wrap.tall { height: 300px; }
      .empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
      #error {
        display: none;
        margin: 16px clamp(16px, 4vw, 48px);
        padding: 14px 18px;
        background: #2a1714;
        border: 1px solid #5a2c24;
        border-radius: 12px;
        color: #f0c4bc;
        font-size: 14px;
      }
      .footnote { color: var(--muted); font-size: 12px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>The Clasp</h1>
        <span>Analytics</span>
      </div>
      <div class="meta">
        <span id="generated">—</span>
        <button id="refresh">Refresh</button>
      </div>
    </header>

    <div id="error"></div>

    <main>
      <section class="grid kpis" id="kpis"></section>

      <section class="grid charts">
        <div class="panel wide">
          <h2>Activity — last 30 days</h2>
          <div class="canvas-wrap tall"><canvas id="trends"></canvas></div>
        </div>
        <div class="panel">
          <h2>Bookings by status</h2>
          <div class="canvas-wrap"><canvas id="bookingStatus"></canvas></div>
        </div>
        <div class="panel">
          <h2>Items by visibility</h2>
          <div class="canvas-wrap"><canvas id="visibility"></canvas></div>
        </div>
        <div class="panel">
          <h2>Items by category</h2>
          <div class="canvas-wrap"><canvas id="category"></canvas></div>
        </div>
        <div class="panel">
          <h2>Items by condition</h2>
          <div class="canvas-wrap"><canvas id="condition"></canvas></div>
        </div>
      </section>
    </main>

    <script>
      const FONT = "'Montserrat', sans-serif";
      Chart.defaults.color = '#a89e90';
      Chart.defaults.font.family = FONT;
      Chart.defaults.borderColor = '#342c24';

      const C = {
        accent: '#c9a96a',
        green: '#8fae9b',
        pink: '#b5879c',
        blue: '#7f93b5',
        grid: '#342c24',
      };

      const charts = {};
      function draw(id, config) {
        if (charts[id]) charts[id].destroy();
        charts[id] = new Chart(document.getElementById(id), config);
      }

      function fmtPct(x) {
        return x == null ? '—' : Math.round(x * 100) + '%';
      }
      function fmtNum(x) {
        return x == null ? '—' : (Math.round(x * 10) / 10).toLocaleString();
      }

      const VIS_LABELS = { private: 'Private', public: 'Public', groups: 'Closets' };
      const visLabel = (k) => VIS_LABELS[k] || (k == null ? '—' : k);
      const condLabel = (k) => (k == null ? 'Unrated' : k + '★');
      const titleCase = (s) => (s == null ? '—' : String(s).charAt(0).toUpperCase() + String(s).slice(1));

      function kpiCard(label, value, sub) {
        return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub || ''}</div></div>`;
      }

      function renderKpis(d) {
        const cards = [
          kpiCard('Users', d.users.total.toLocaleString(), `+${d.users.new30} in 30d`),
          kpiCard('Active (30d)', d.users.active30.toLocaleString(), `${d.users.active7} in 7d`),
          kpiCard('Google-linked', d.users.googleLinked.toLocaleString(), ''),
          kpiCard('Items', d.jewelry.total.toLocaleString(), `+${d.jewelry.new30} in 30d`),
          kpiCard('Bookings', d.bookings.total.toLocaleString(), ''),
          kpiCard('Acceptance', fmtPct(d.bookings.acceptanceRate), 'of decided requests'),
          kpiCard('Avg loan', d.bookings.avgLoanDays == null ? '—' : fmtNum(d.bookings.avgLoanDays) + 'd', ''),
          kpiCard('Closets', d.closets.total.toLocaleString(), `${fmtNum(d.closets.avgMembers)} avg members`),
          kpiCard('Messages', d.messaging.total.toLocaleString(), `${d.messaging.last7} in 7d`),
          kpiCard('Push enabled', d.users.withPush.toLocaleString(), 'users'),
        ];
        document.getElementById('kpis').innerHTML = cards.join('');
      }

      function lineDataset(label, series, color) {
        return {
          label,
          data: series.map((p) => p.count),
          borderColor: color,
          backgroundColor: color + '22',
          borderWidth: 2,
          tension: 0.3,
          pointRadius: 0,
          pointHoverRadius: 4,
          fill: false,
        };
      }

      function renderTrends(d) {
        const labels = d.trends.signups.map((p) => p.date.slice(5)); // MM-DD
        draw('trends', {
          type: 'line',
          data: {
            labels,
            datasets: [
              lineDataset('Signups', d.trends.signups, C.accent),
              lineDataset('Items', d.trends.items, C.green),
              lineDataset('Bookings', d.trends.bookings, C.blue),
              lineDataset('Messages', d.trends.messages, C.pink),
            ],
          },
          options: {
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } },
            scales: {
              x: { grid: { display: false } },
              y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: C.grid } },
            },
          },
        });
      }

      function doughnut(id, rows, labelFn, palette) {
        if (!rows.length) {
          charts[id]?.destroy();
          document.getElementById(id).parentElement.innerHTML = '<div class="empty">No data yet</div>';
          return;
        }
        draw(id, {
          type: 'doughnut',
          data: {
            labels: rows.map((r) => labelFn(r.key)),
            datasets: [
              { data: rows.map((r) => r.count), backgroundColor: rows.map((_, i) => palette[i % palette.length]), borderColor: '#1f1b18', borderWidth: 2 },
            ],
          },
          options: {
            maintainAspectRatio: false,
            cutout: '58%',
            plugins: { legend: { position: 'right', labels: { usePointStyle: true, boxWidth: 8 } } },
          },
        });
      }

      function bar(id, rows, labelFn, color) {
        if (!rows.length) {
          charts[id]?.destroy();
          document.getElementById(id).parentElement.innerHTML = '<div class="empty">No data yet</div>';
          return;
        }
        draw(id, {
          type: 'bar',
          data: {
            labels: rows.map((r) => labelFn(r.key)),
            datasets: [{ data: rows.map((r) => r.count), backgroundColor: color, borderRadius: 6 }],
          },
          options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false } },
              y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: C.grid } },
            },
          },
        });
      }

      function render(d) {
        renderKpis(d);
        renderTrends(d);
        doughnut('bookingStatus', d.bookings.byStatus, titleCase, [C.green, C.accent, C.pink, C.blue]);
        doughnut('visibility', d.jewelry.byVisibility, visLabel, [C.blue, C.accent, C.green]);
        bar('category', d.jewelry.byCategory, titleCase, C.accent);
        // Condition: sort ascending by star, unrated last.
        const cond = [...d.jewelry.byCondition].sort((a, b) => {
          if (a.key == null) return 1;
          if (b.key == null) return -1;
          return a.key - b.key;
        });
        bar('condition', cond, condLabel, C.green);

        document.getElementById('generated').textContent =
          'Generated ' + new Date(d.generatedAt).toLocaleString();
      }

      async function load() {
        const btn = document.getElementById('refresh');
        const err = document.getElementById('error');
        btn.disabled = true;
        btn.textContent = 'Loading…';
        err.style.display = 'none';
        try {
          const res = await fetch('/api/stats');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          render(await res.json());
        } catch (e) {
          err.textContent = 'Could not load stats: ' + e.message + '. Is the Mongo container reachable on the network?';
          err.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Refresh';
        }
      }

      document.getElementById('refresh').addEventListener('click', load);
      load();
    </script>
  </body>
</html>
