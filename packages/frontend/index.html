<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA meta -->
    <meta name="theme-color" content="#1A3A2E" />
    <meta name="color-scheme" content="light" />

    <!-- Link preview (Open Graph / Twitter). Everything between the og markers
         below is the DEFAULT ("regular link") preview, served as-is by
         express.static for the homepage and ordinary routes. The backend swaps
         this region for personalised tags on closet invite links
         (/join/:token) — see packages/backend/src/utils/linkPreview.ts.
         Keep the markers intact. -->
    <!-- og:start -->
    <meta name="description" content="The Clasp is a space to share the beautiful pieces in your closet with the people you trust most. Borrow Theirs. Lend Yours. Open your Closet today." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Clasp" />
    <meta property="og:title" content="The Clasp" />
    <meta property="og:description" content="The Clasp is a space to share the beautiful pieces in your closet with the people you trust most. Borrow Theirs. Lend Yours. Open your Closet today." />
    <meta property="og:url" content="https://theclasp.ca" />
    <meta property="og:image" content="https://theclasp.ca/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The Clasp" />
    <meta name="twitter:description" content="The Clasp is a space to share the beautiful pieces in your closet with the people you trust most. Borrow Theirs. Lend Yours. Open your Closet today." />
    <meta name="twitter:image" content="https://theclasp.ca/icons/icon-512.png" />
    <!-- og:end -->

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="The Clasp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    />

    <link rel="icon" type="image/png" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-maskable-512.png" />

    <title>The Clasp</title>

    <style>
      html { margin: 0; padding: 0; height: 100%; background-color: #F5ECD7; color-scheme: light; }
      body { margin: 0; padding: 0; min-height: 100%; background-color: #F5ECD7; -webkit-overflow-scrolling: touch; }
      #root { min-height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
